# ==============================================================================
# VkLayer_WUWA_antidither配置文件
# 文件位置: ~/.config/anti_dither/rules.conf
#
# 注意事项:
# 1. 开关项严格使用 1 (开启) 或 0 (关闭)
# 2. 命令行或启动项环境变量 (如 ANTI_DITHER_ENABLED=1) 具备最高优先级，覆盖本文件设置。
# 3. 井号 (#) 或分号 (;) 开头的行表示注释。
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 核心运行开关
# ------------------------------------------------------------------------------
# 控制反虚化驱动层是否激活:
#   1 = 强制启用
#   0 = 强制禁用
#   注释或留空 = 自动模式 (默认由内置进程名白名单自动判断)
#
# enabled = 1

# ------------------------------------------------------------------------------
# 2. 诊断日志开关 (log)
# ------------------------------------------------------------------------------
# 是否在终端及日志文件中打印着色器修补现场详细日志:
#   1 = 开启日志 (日志写入 /tmp/game_anti_dither/logs/进程名.log)
#   0 = 关闭日志
#
log = 0

# ------------------------------------------------------------------------------
# 3. 着色器转储开关 (dump)
# ------------------------------------------------------------------------------
# 是否将截获到的着色器原始 SPIR-V、修补后二进制及数据流分析报告导出到磁盘:
#   1 = 开启转储 (保存于 /tmp/game_anti_dither/dumps/<进程名>/)
#   0 = 关闭转储 (默认)
#
dump = 0

# ------------------------------------------------------------------------------
# 4. 自定义目标进程名白名单 (targets)
# ------------------------------------------------------------------------------
# 若游戏不在内置支持列表中，可在此指定游戏进程名或可执行文件名关键字。
# 匹配到该关键字的游戏将自动激活反虚化层 (多个关键字可用逗号分隔)。
#
# targets = MyGame-Win64-Shipping,wuwa（为自定义程序启用鸣潮反虚化处理）

# ------------------------------------------------------------------------------
# 5. 着色器黑名单 (exclude_hashes)
# ------------------------------------------------------------------------------
# 若发现某个特定 Shader Hash 导致特定特效异常或画面破损，可将其加入黑名单予以豁免。
# 多个 Hash 使用逗号、分号或空格分隔。
#
# exclude_hashes = 0xfe0ddc28, 0x527c85c0

# ------------------------------------------------------------------------------
# 6. 着色器白名单 (force_hashes)
# ------------------------------------------------------------------------------
# 强制对指定的 Shader Hash 执行反虚化消除，即使未检测到典型噪声特征。
# 多个 Hash 使用逗号、分号或空格分隔。
#
# force_hashes = 0xda1582f2, 0xc9750142

# ------------------------------------------------------------------------------
# 7. 极端诊断调试工具
# ------------------------------------------------------------------------------
# force_all: 强制无条件消除所有着色器中的 Discard/Demote 指令 (1: 开启, 0: 关闭)
# hash_min / hash_max: 配合 force_all 进行二分法范围定位时的十六进制上下界
#
# force_all = 0
# hash_min = 0x00000000
# hash_max = 0xFFFFFFFF
