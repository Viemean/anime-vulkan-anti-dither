# ==============================================================================
# VkLayer_WUWA_antidither 配置文件
# 文件位置: ~/.config/anti_dither/rules.conf
# 优先级: 环境变量 (如 ANTI_DITHER_ENABLED=1) > 本配置文件 > 内置默认值
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 主要功能设置 (Main Settings)
# ------------------------------------------------------------------------------

# 反虚化核心开关: 1=强制开启, 0=强制关闭, 注释或留空=自动根据内置白名单判断
# enabled = 1

# 帧率解锁开关 (米哈游游戏): 1=开启, 0=关闭
# fps_unlock = 0

# 目标帧率设定: 0=不限帧, 30 及以上=具体目标帧率 (默认 120)
# target_fps = 120

# 自定义目标进程名白名单: 多个以逗号分隔 (如 MyGame-Win64-Shipping,wuwa)
# targets = 


# ------------------------------------------------------------------------------
# 2. 开发与诊断设置 (Developer & Debug)
# ------------------------------------------------------------------------------

# 详细运行时日志: 1=开启 (输出至 /tmp/game_anti_dither/logs/<进程名>.log), 0=关闭
log = 0

# 着色器 SPIR-V 转储: 1=开启 (输出至 /tmp/game_anti_dither/dumps/<进程名>/), 0=关闭
dump = 0

# 着色器黑名单: 豁免指定 Hash 不被改写，多个以逗号或空格分隔
# exclude_hashes = 0xfe0ddc28, 0x527c85c0

# 着色器白名单: 强制对指定 Hash 执行反虚化消除，多个以逗号或空格分隔
# force_hashes = 0xda1582f2, 0xc9750142

# 极端诊断开关: 配合二分法排查故障着色器 (force_all=1 时强制消除所有 Discard/Demote)
# force_all = 0
# hash_min = 0x00000000
# hash_max = 0xFFFFFFFF
