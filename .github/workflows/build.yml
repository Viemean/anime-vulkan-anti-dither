name: Build Vulkan Anti-Dither Layer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86_64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libvulkan-dev zstd dpkg-dev

      - name: Build and package (tar.gz, tar.zst, deb)
        run: |
          chmod +x package.sh vulkan-layer/build.sh vulkan-layer/install.sh vulkan-layer/uninstall.sh
          ./package.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-anti-dither-packages
          path: dist/packages/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
