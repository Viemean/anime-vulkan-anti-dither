name: Build Vulkan Anti-Dither Layer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            libvulkan-dev \
            zstd \
            dpkg-dev \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Build and package (x86_64 & aarch64/arm64)
        run: |
          chmod +x package.sh vulkan-layer/build.sh vulkan-layer/install.sh vulkan-layer/uninstall.sh
          ./package.sh all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-anti-dither-packages
          path: dist/packages/*

      - name: Get short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Release 1.0.0+${{ steps.vars.outputs.sha_short }}"
          files: dist/packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
