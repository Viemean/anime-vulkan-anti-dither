name: Build Vulkan Anti-Dither Layer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-setuptools \
            ninja-build \
            libvulkan-dev \
            zstd \
            dpkg-dev \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu
          sudo python3 -m pip install --upgrade meson

      - name: Build and package (x86_64 & aarch64/arm64)
        run: |
          chmod +x package.sh vulkan-layer/build.sh vulkan-layer/install.sh vulkan-layer/uninstall.sh
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./package.sh all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-anti-dither-packages
          path: dist/packages/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: dist/packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
