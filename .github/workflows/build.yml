name: Build Vulkan Anti-Dither Layer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libvulkan-dev

      - name: Build and Test
        run: |
          chmod +x vulkan-layer/build.sh vulkan-layer/install.sh vulkan-layer/uninstall.sh
          ./vulkan-layer/build.sh
          ninja -C vulkan-layer/build test

      - name: Package release
        run: |
          mkdir -p release-pkg
          cp -f vulkan-layer/dist/libwuwa_antidither_layer.so release-pkg/
          cp -f vulkan-layer/dist/VkLayer_WUWA_antidither.json release-pkg/
          cp -f vulkan-layer/install.sh release-pkg/
          cp -f vulkan-layer/uninstall.sh release-pkg/
          tar -czvf wuwa-vulkan-layer.tar.gz -C release-pkg .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wuwa-vulkan-layer
          path: |
            wuwa-vulkan-layer.tar.gz
            vulkan-layer/dist/libwuwa_antidither_layer.so
            vulkan-layer/dist/VkLayer_WUWA_antidither.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wuwa-vulkan-layer.tar.gz
            vulkan-layer/dist/libwuwa_antidither_layer.so
            vulkan-layer/dist/VkLayer_WUWA_antidither.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
